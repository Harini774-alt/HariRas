<!DOCTYPE html>
<html>
<head>
    <title>Google Clone</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="googlestyle.css">
</head>

<body>

    

    <header>
        <div class="right-nav">
            <a href="#">Gmail</a>
            <a href="#">Images</a>

            <span class="material-icons">apps</span>

            <img src="noodles2.jpg" class="profile">
        </div>
    </header>

    <main>
        <h1 class="google">Google</h1>

        <div class="searchbox">
            <span class="material-icons">search</span>

            <input type="text" placeholder="Ask Google">

            <span class="material-icons">mic</span>
            <span class="material-icons">photo_camera</span>
        </div>

        <div class="shortcuts">

            <div class="item">
                <div class="circle">
                    <img src="chatgpt.jpg" class="icon">
                </div>
                <p>ChatGPT</p>
            </div>

            <div class="item">
                <div class="circle">
                    <img src="youtube.jpg" class="icon">
                </div>
                <p>YouTube</p>
            </div>

            <div class="item">
                <div class="circle">
                    <img src="gmail.jpg" class="icon">
                </div>
                <p>Gmail</p>
            </div>

        </div>

    </main>

</body>
</html>
